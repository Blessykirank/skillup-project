
<section class="content-page">
    <div class="page-heading">
        <span class="welcome-tag">WE'RE HERE TO HELP</span>
        <h1>Let's <span>Connect</span></h1>
        <p>Have a question or suggestion? Send us a message.</p>
    </div>

    <div class="contact-layout">
        <div class="contact-info">
            <h2>Get in touch 💌</h2>
            <p>We'd love to hear your feedback about SkillUp.</p>

            <div class="contact-item">
                <span>📚</span>
                <div>
                    <strong>Course Questions</strong>
                    <p>Ask us about learning topics.</p>
                </div>
            </div>

            <div class="contact-item">
                <span>💡</span>
                <div>
                    <strong>Suggestions</strong>
                    <p>Share ideas to improve the platform.</p>
                </div>
            </div>

            <div class="contact-item">
                <span>🤝</span>
                <div>
                    <strong>General Enquiries</strong>
                    <p>Tell us how we can help.</p>
                </div>
            </div>
        </div>

        <form class="site-form" id="contactForm">
            <label for="contactName">Your Name</label>
            <input id="contactName" name="name" type="text"
                   placeholder="Enter your name" required>

            <label for="contactEmail">Email Address</label>
            <input id="contactEmail" name="email" type="email"
                   placeholder="you@example.com" required>

            <label for="contactSubject">Subject</label>
            <input id="contactSubject" name="subject" type="text"
                   placeholder="What is your message about?" required>

            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" rows="5"
                      placeholder="Write your message here..." required></textarea>

            <button type="submit" class="signup-btn">Send Message →</button>
            <p class="form-message" id="contactFeedback" aria-live="polite"></p>
        </form>
    </div>
</section>
